[pytest]
addopts =
    -ra
    --cov=jellyfin_show_organizer
    --cov-branch
    --cov-report=term-missing:skip-covered
    # Windows skips a small set of symlink-only cases; keep the gate above the
    # measured project baseline while allowing the cross-platform suite to run.
    --cov-fail-under=83.0
testpaths = tests/local
markers =
    local: deterministic offline organizer tests
