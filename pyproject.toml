[project]
name = "jellyfin-media-organizer"
dynamic = ["version"]
description = "Plan-first Jellyfin media organizer, currently focused on TV shows."
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.12"
dependencies = []
keywords = ["jellyfin", "media", "organizer", "tv"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://github.com/akjroller/jellyfin-media-organizer"
Repository = "https://github.com/akjroller/jellyfin-media-organizer"
Issues = "https://github.com/akjroller/jellyfin-media-organizer/issues"

[project.scripts]
jmo = "jellyfin_show_organizer.cli:main"
organizer = "jellyfin_show_organizer.cli:main"

[project.optional-dependencies]
dev = [
    "mypy>=2.1,<3",
    "pytest>=8.3,<10",
    "ruff>=0.15,<1",
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jellyfin_show_organizer"]

[tool.setuptools.dynamic]
version = { attr = "jellyfin_show_organizer.__version__" }

[tool.setuptools.package-data]
jellyfin_show_organizer = ["data/*.json", "data/*.toml"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "C901"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["jellyfin_show_organizer"]
combine-as-imports = true
