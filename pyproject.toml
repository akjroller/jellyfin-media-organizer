[project]
name = "jellyfin-media-organizer"
version = "0.1.0"
description = "Plan-first Jellyfin media organizer, currently focused on TV shows."
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.12"
dependencies = []

[project.scripts]
jmo = "jellyfin_show_organizer.cli:main"
organizer = "jellyfin_show_organizer.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.15,<1",
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jellyfin_show_organizer"]

[tool.setuptools.package-data]
jellyfin_show_organizer = ["data/*.json", "data/*.toml"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "C901"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["jellyfin_show_organizer"]
combine-as-imports = true
