name: Temporary composite title integration

on:
  push:
    branches:
      - fix/composite-aired-title-rescue
    paths:
      - .github/workflows/temp-composite-title-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/composite-aired-title-rescue
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate composite title rescue
        shell: python
        run: |
          from pathlib import Path

          alias_path = Path('jellyfin_show_organizer/show_alias_evidence.py')
          alias_text = alias_path.read_text(encoding='utf-8')
          alias_import = 'from .models import CandidateEvidence, NumberingMode, ParseResult, ProviderIdentity\n'
          alias_replacement = '''from .episode_title_evidence import (\n    is_composite_title_authoritative_group,\n    normalize_episode_title,\n    normalized_episode_title_hint,\n)\nfrom .models import CandidateEvidence, NumberingMode, ParseResult, ProviderIdentity\n'''
          if alias_text.count(alias_import) != 1:
              raise SystemExit('expected show_alias_evidence import anchor exactly once')
          alias_text = alias_text.replace(alias_import, alias_replacement, 1)

          alias_anchor = '''def catalog_group_rescue(\n    provider: MetadataProvider,\n    parses: tuple[ParseResult, ...],\n    ranked: tuple[CandidateEvidence, ...],\n) -> CatalogGroupRescue | None:\n'''
          alias_helper = '''def _composite_aired_title_catalog_compatibility(\n    parses: tuple[ParseResult, ...],\n    catalog: ProviderEpisodeCatalog,\n) -> tuple[bool | None, tuple[str, ...]]:\n    request_reason = f"composite-aired-title-request:{catalog.request_key}"\n    if not catalog.resolved:\n        return None, (\n            request_reason,\n            "composite-aired-title-rescue:indeterminate-catalog",\n            f"catalog-unresolved:{catalog.unresolved_reason or 'provider-catalog-unresolved'}",\n        )\n    if catalog.errors:\n        return None, (\n            request_reason,\n            "composite-aired-title-rescue:indeterminate-catalog",\n            *(f"catalog-error:{error}" for error in catalog.errors),\n        )\n\n    by_title: dict[str, list[ProviderIdentity]] = {}\n    for episode in catalog.episodes:\n        title = normalize_episode_title(episode.title)\n        if title:\n            by_title.setdefault(title, []).append(episode.identity)\n\n    observed = tuple(\n        normalized_episode_title_hint(parse.title_hint or "") for parse in parses\n    )\n    reasons: list[str] = [request_reason]\n    selected: list[ProviderIdentity] = []\n    for title in observed:\n        if not title:\n            reasons.append("composite-aired-title-empty-observation")\n            return False, tuple(reasons)\n        matches = tuple(by_title.get(title, ()))\n        if not matches:\n            reasons.append(f"composite-aired-title-missing:{title}")\n            return False, tuple(reasons)\n        if len(matches) != 1:\n            reasons.append(f"composite-aired-title-ambiguous:{title}")\n            return False, tuple(reasons)\n        selected.append(matches[0])\n\n    if len(set(selected)) != len(selected):\n        reasons.append("composite-aired-title-distinct-sources-collapse")\n        return False, tuple(reasons)\n\n    reasons.extend(\n        (\n            f"composite-aired-title-exact-matches:{len(selected)}/{len(observed)}",\n            "composite-aired-title-compatible:true",\n        )\n    )\n    return True, tuple(reasons)\n\n\ndef composite_aired_title_rescue(\n    provider: MetadataProvider,\n    parses: tuple[ParseResult, ...],\n    ranked: tuple[CandidateEvidence, ...],\n) -> CatalogGroupRescue | None:\n    if not ranked or not is_composite_title_authoritative_group(parses):\n        return None\n\n    compatibility: dict[ProviderIdentity, bool | None] = {}\n    candidate_reasons: dict[ProviderIdentity, tuple[str, ...]] = {}\n    for candidate in sorted(ranked, key=lambda item: item.provider_identity.key):\n        catalog = provider.episode_catalog(candidate.provider_identity)\n        compatible, reasons = _composite_aired_title_catalog_compatibility(\n            parses, catalog\n        )\n        compatibility[candidate.provider_identity] = compatible\n        candidate_reasons[candidate.provider_identity] = reasons\n\n    enriched = tuple(\n        replace(\n            candidate,\n            reasons=(\n                *candidate.reasons,\n                *candidate_reasons.get(candidate.provider_identity, ()),\n            ),\n        )\n        for candidate in ranked\n    )\n    if any(value is None for value in compatibility.values()):\n        return CatalogGroupRescue(\n            winner=None,\n            numbering_mode=None,\n            candidates=enriched,\n            reasons=(\n                "composite-aired-title-rescue:indeterminate-candidate-catalog",\n            ),\n        )\n\n    winners = tuple(\n        identity\n        for identity, compatible in sorted(\n            compatibility.items(), key=lambda item: item[0].key\n        )\n        if compatible\n    )\n    if len(winners) != 1:\n        return CatalogGroupRescue(\n            winner=None,\n            numbering_mode=None,\n            candidates=enriched,\n            reasons=(\n                "composite-aired-title-rescue:no-unique-compatible-candidate",\n            ),\n        )\n\n    winner = winners[0]\n    winner_first = tuple(\n        sorted(\n            enriched,\n            key=lambda candidate: (\n                candidate.provider_identity != winner,\n                -candidate.score,\n                _normalize(candidate.title),\n                candidate.provider_identity.key,\n            ),\n        )\n    )\n    return CatalogGroupRescue(\n        winner=winner,\n        numbering_mode=NumberingMode.SEGMENT_TITLE,\n        candidates=winner_first,\n        reasons=(\n            "composite-aired-title-rescue:unique-compatible-candidate",\n            f"composite-aired-title-rescue-winner:{winner.key}",\n            "composite-aired-title-rescue-numbering-mode:segment-title",\n        ),\n    )\n\n\n'''
          if alias_text.count(alias_anchor) != 1:
              raise SystemExit('expected catalog_group_rescue anchor exactly once')
          alias_text = alias_text.replace(alias_anchor, alias_helper + alias_anchor, 1)
          alias_path.write_text(alias_text, encoding='utf-8')

          core_path = Path('jellyfin_show_organizer/_show_resolver_core.py')
          core_text = core_path.read_text(encoding='utf-8')
          core_import = '''from .show_alias_evidence import (\n    catalog_group_rescue,\n    enrich_provider_alias_evidence,\n)\n'''
          core_replacement = '''from .show_alias_evidence import (\n    catalog_group_rescue,\n    composite_aired_title_rescue,\n    enrich_provider_alias_evidence,\n)\n'''
          if core_text.count(core_import) != 1:
              raise SystemExit('expected core alias import block exactly once')
          core_text = core_text.replace(core_import, core_replacement, 1)

          variable_anchor = '''    title_tie_break = None\n    aired_rescue = None\n    rescue = None\n'''
          variable_replacement = '''    title_tie_break = None\n    aired_rescue = None\n    composite_rescue = None\n    rescue = None\n'''
          if core_text.count(variable_anchor) != 1:
              raise SystemExit('expected rescue variable block exactly once')
          core_text = core_text.replace(variable_anchor, variable_replacement, 1)

          rescue_anchor = '''        if tie_break is None and aired_rescue is None:\n            rescue = catalog_group_rescue(provider, parse_group, active_ranked)\n'''
          composite_block = '''        if mode is NumberingMode.AIRED and (\n            aired_rescue is None or aired_rescue.winner is None\n        ):\n            composite_rescue = composite_aired_title_rescue(\n                provider, parse_group, active_ranked\n            )\n            if (\n                composite_rescue is not None\n                and composite_rescue.winner is not None\n            ):\n                provider_show = next(\n                    candidate\n                    for candidate in provider_candidates\n                    if candidate.identity == composite_rescue.winner\n                )\n                title = _preferred_title(override, source_title, provider_show.title)\n                assert title is not None\n                return ShowResolution(\n                    status=ResolutionStatus.MATCHED,\n                    show=CanonicalShow(\n                        source_key=source_key,\n                        provider_identity=provider_show.identity,\n                        title=title,\n                        year=(\n                            provider_show.year\n                            if provider_show.year is not None\n                            else year_hint\n                        ),\n                        numbering_mode=NumberingMode.SEGMENT_TITLE,\n                    ),\n                    evidence=MatchEvidence(\n                        method=f"{method}+composite-aired-title-rescue",\n                        confidence=top.score,\n                        reasons=(\n                            *search_reasons,\n                            *(\n                                alias_result.reasons\n                                if alias_result is not None\n                                else ()\n                            ),\n                            *(tie_break.reasons if tie_break is not None else ()),\n                            *(\n                                title_tie_break.reasons\n                                if title_tie_break is not None\n                                else ()\n                            ),\n                            *(\n                                aired_rescue.reasons\n                                if aired_rescue is not None\n                                else ()\n                            ),\n                            *composite_rescue.reasons,\n                            f"candidate-gap:{gap:.3f}",\n                        ),\n                        candidates=composite_rescue.candidates,\n                    ),\n                )\n\n        if (\n            tie_break is None\n            and aired_rescue is None\n            and composite_rescue is None\n        ):\n            rescue = catalog_group_rescue(provider, parse_group, active_ranked)\n'''
          if core_text.count(rescue_anchor) != 1:
              raise SystemExit('expected generic rescue anchor exactly once')
          core_text = core_text.replace(rescue_anchor, composite_block, 1)

          candidate_anchor = '''    candidates = active_ranked\n    if title_tie_break is not None:\n        candidates = title_tie_break.candidates\n    elif aired_rescue is not None:\n        candidates = aired_rescue.candidates\n'''
          candidate_replacement = '''    candidates = active_ranked\n    if composite_rescue is not None:\n        candidates = composite_rescue.candidates\n    elif title_tie_break is not None:\n        candidates = title_tie_break.candidates\n    elif aired_rescue is not None:\n        candidates = aired_rescue.candidates\n'''
          if core_text.count(candidate_anchor) != 1:
              raise SystemExit('expected final candidate selection anchor exactly once')
          core_text = core_text.replace(candidate_anchor, candidate_replacement, 1)

          reason_anchor = '''                *(aired_rescue.reasons if aired_rescue is not None else ()),\n                *(rescue.reasons if rescue is not None else ()),\n'''
          reason_replacement = '''                *(aired_rescue.reasons if aired_rescue is not None else ()),\n                *(\n                    composite_rescue.reasons\n                    if composite_rescue is not None\n                    else ()\n                ),\n                *(rescue.reasons if rescue is not None else ()),\n'''
          if core_text.count(reason_anchor) != 1:
              raise SystemExit('expected final reason block exactly once')
          core_text = core_text.replace(reason_anchor, reason_replacement, 1)
          core_path.write_text(core_text, encoding='utf-8')

          strict_path = Path('jellyfin_show_organizer/episode_assignment_strict.py')
          strict_text = strict_path.read_text(encoding='utf-8')
          strict_import = '''from .models import (\n    CanonicalShow,\n'''
          strict_replacement = '''from .episode_title_evidence import (\n    is_title_authoritative_aired_parse,\n    normalize_episode_title,\n    normalized_episode_title_hint,\n)\nfrom .models import (\n    CanonicalShow,\n'''
          if strict_text.count(strict_import) != 1:
              raise SystemExit('expected strict import anchor exactly once')
          strict_text = strict_text.replace(strict_import, strict_replacement, 1)

          family_anchor = '''    has_date = parse.episode_date is not None\n\n    if parse.segment_hint is not None:\n'''
          family_replacement = '''    has_date = parse.episode_date is not None\n\n    if (\n        mode is NumberingMode.SEGMENT_TITLE\n        and parse.segment_hint is None\n        and is_title_authoritative_aired_parse(parse)\n    ):\n        return "segment"\n\n    if parse.segment_hint is not None:\n'''
          if strict_text.count(family_anchor) != 1:
              raise SystemExit('expected evidence family anchor exactly once')
          strict_text = strict_text.replace(family_anchor, family_replacement, 1)

          segment_start = '''    parse = source.parse\n    if parse.segment_hint is None:\n        return _assignment(\n            source.source_key,\n            AssignmentStatus.UNRESOLVED,\n            "episode-catalog",\n            f"numbering-mode:{show.numbering_mode.value}",\n            "missing-segment-hint",\n            f"catalog-request:{request_key}",\n        )\n    if parse.title_hint is None or not parse.title_hint.strip():\n'''
          segment_replacement = '''    parse = source.parse\n    title_authoritative_aired = (\n        parse.segment_hint is None and is_title_authoritative_aired_parse(parse)\n    )\n    if parse.segment_hint is None and not title_authoritative_aired:\n        return _assignment(\n            source.source_key,\n            AssignmentStatus.UNRESOLVED,\n            "episode-catalog",\n            f"numbering-mode:{show.numbering_mode.value}",\n            "missing-segment-hint",\n            f"catalog-request:{request_key}",\n        )\n    if parse.title_hint is None or not parse.title_hint.strip():\n'''
          if strict_text.count(segment_start) != 1:
              raise SystemExit('expected segment assignment start exactly once')
          strict_text = strict_text.replace(segment_start, segment_replacement, 1)

          normalized_anchor = '''    normalized_title = _normalize_title(parse.title_hint)\n    matches = tuple(\n        episode\n        for episode in catalog.episodes\n        if _normalize_title(episode.title) == normalized_title\n    )\n'''
          normalized_replacement = '''    normalized_title = (\n        normalized_episode_title_hint(parse.title_hint)\n        if title_authoritative_aired\n        else _normalize_title(parse.title_hint)\n    )\n    matches = tuple(\n        episode\n        for episode in catalog.episodes\n        if (\n            normalize_episode_title(episode.title)\n            if title_authoritative_aired\n            else _normalize_title(episode.title)\n        )\n        == normalized_title\n    )\n'''
          if strict_text.count(normalized_anchor) != 1:
              raise SystemExit('expected segment title match block exactly once')
          strict_text = strict_text.replace(normalized_anchor, normalized_replacement, 1)

          matched_anchor = '''    episode = matches[0]\n    return _assignment(\n        source.source_key,\n        AssignmentStatus.MATCHED,\n        "episode-catalog",\n        f"numbering-mode:{show.numbering_mode.value}",\n        f"segment-hint:{parse.segment_hint.casefold()}",\n        f"segment-title-match:{normalized_title}",\n        f"catalog-request:{request_key}",\n        _episode_identity_reason(episode),\n        episodes=(episode,),\n        confidence=1.0,\n    )\n'''
          matched_replacement = '''    episode = matches[0]\n    reasons = [f"numbering-mode:{show.numbering_mode.value}"]\n    if title_authoritative_aired:\n        assert parse.season is not None\n        coordinates = ",".join(\n            f"S{parse.season:02d}E{number:02d}" for number in parse.episodes\n        )\n        reasons.extend(\n            (\n                "title-authoritative-aired-remap",\n                f"segment-coordinate-evidence:{coordinates}",\n            )\n        )\n    else:\n        assert parse.segment_hint is not None\n        reasons.append(f"segment-hint:{parse.segment_hint.casefold()}")\n    reasons.extend(\n        (\n            f"segment-title-match:{normalized_title}",\n            f"catalog-request:{request_key}",\n            _episode_identity_reason(episode),\n        )\n    )\n    return _assignment(\n        source.source_key,\n        AssignmentStatus.MATCHED,\n        "episode-catalog",\n        *reasons,\n        episodes=(episode,),\n        confidence=1.0,\n    )\n'''
          if strict_text.count(matched_anchor) != 1:
              raise SystemExit('expected segment matched return exactly once')
          strict_text = strict_text.replace(matched_anchor, matched_replacement, 1)

          protect_anchor = '''    if show.numbering_mode is NumberingMode.SEGMENT_TITLE:\n        assignments = _protect_segment_identity(source_group, assignments)\n    else:\n        assignments = _protect_provider_episode_identity(assignments)\n'''
          protect_replacement = '''    if show.numbering_mode is NumberingMode.SEGMENT_TITLE:\n        assignments = _protect_segment_identity(source_group, assignments)\n        assignments = _protect_provider_episode_identity(assignments)\n    else:\n        assignments = _protect_provider_episode_identity(assignments)\n'''
          if strict_text.count(protect_anchor) != 1:
              raise SystemExit('expected segment identity protection block exactly once')
          strict_text = strict_text.replace(protect_anchor, protect_replacement, 1)
          strict_path.write_text(strict_text, encoding='utf-8')
      - name: Format changed Python
        run: |
          python -m pip install ruff==0.15.20
          python -m ruff format jellyfin_show_organizer/episode_title_evidence.py jellyfin_show_organizer/show_alias_evidence.py jellyfin_show_organizer/_show_resolver_core.py jellyfin_show_organizer/episode_assignment_strict.py tests/local/test_composite_aired_title_rescue.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jellyfin_show_organizer/episode_title_evidence.py jellyfin_show_organizer/show_alias_evidence.py jellyfin_show_organizer/_show_resolver_core.py jellyfin_show_organizer/episode_assignment_strict.py tests/local/test_composite_aired_title_rescue.py
          git commit -m "Rescue composite aired files by exact titles"
          git push origin HEAD:fix/composite-aired-title-rescue
