name: Issue 112 golden hash

on:
  push:
    branches: [issue-112-extra-destination-identity]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-112-extra-destination-identity
      - name: Update verified release-candidate hash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/local/test_release_candidate_ready.py")
          text = path.read_text(encoding="utf-8")
          old = "0383550248892bc2979c1ad8d258b4835772b67616b794fe78e9cb739d7c3bd2"
          new = "53bac569b37ff5257abc09190d86e895955a8895052ca967a068b83737943769"
          assert old in text
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Persist verified hash
        run: |
          git config user.name "jmo-fixture"
          git config user.email "jmo-fixture@users.noreply.github.com"
          git add tests/local/test_release_candidate_ready.py
          git commit -m "Refresh approved plan hash for extra naming evidence [skip ci]"
          git push
