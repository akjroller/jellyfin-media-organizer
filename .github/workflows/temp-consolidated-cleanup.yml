name: Consolidated cleanup check

on:
  push:
    branches:
      - fix/consolidated-final-blocker-cleanup
    paths:
      - .github/workflows/temp-consolidated-cleanup.yml

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/consolidated-final-blocker-cleanup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply consolidated changes
        run: |
          python .github/scripts/temp_cleanup_parser.py
          python .github/scripts/temp_cleanup_segment.py
          python .github/scripts/temp_cleanup_tests.py
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Format and focused checks
        run: |
          python -m ruff format jellyfin_show_organizer/_show_resolver_core.py jellyfin_show_organizer/filename_parser.py jellyfin_show_organizer/segment_counted_titles.py jellyfin_show_organizer/mixed_episode_assignment.py tests/local/test_consolidated_cleanup.py
          python -m ruff check jellyfin_show_organizer/_show_resolver_core.py jellyfin_show_organizer/filename_parser.py jellyfin_show_organizer/segment_counted_titles.py jellyfin_show_organizer/mixed_episode_assignment.py tests/local/test_consolidated_cleanup.py
          python -m ruff format --check jellyfin_show_organizer/_show_resolver_core.py jellyfin_show_organizer/filename_parser.py jellyfin_show_organizer/segment_counted_titles.py jellyfin_show_organizer/mixed_episode_assignment.py tests/local/test_consolidated_cleanup.py
          python -m mypy jellyfin_show_organizer tests
          python -m pytest tests/local/test_consolidated_cleanup.py tests/local/test_filename_parser_parent_release_prefix.py tests/local/test_segment_counted_title_remap.py tests/local/test_show_resolver.py
      - name: Commit consolidated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jellyfin_show_organizer/_show_resolver_core.py jellyfin_show_organizer/filename_parser.py jellyfin_show_organizer/segment_counted_titles.py jellyfin_show_organizer/mixed_episode_assignment.py tests/local/test_consolidated_cleanup.py
          git commit -m "Consolidate remaining safe resolver recovery"
          git push origin HEAD:fix/consolidated-final-blocker-cleanup
