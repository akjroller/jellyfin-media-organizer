name: Format issue 9 branch

on:
  push:
    branches: [issue-9-episode-assignment]
    paths:
      - .github/workflows/format-issue-9.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: issue-9-episode-assignment

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: python -m pip install -e ".[dev]"

      - name: Apply Ruff fixes and formatting
        run: |
          python -m ruff check --fix jellyfin_show_organizer tests
          python -m ruff format jellyfin_show_organizer tests

      - name: Commit formatter changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jellyfin_show_organizer tests
          git commit -m "Apply repository formatting"
          git push origin HEAD:issue-9-episode-assignment
