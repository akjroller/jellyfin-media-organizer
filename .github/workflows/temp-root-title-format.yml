name: Temporary root title formatter

on:
  push:
    branches:
      - fix/structural-root-title-discovery
    paths:
      - .github/workflows/temp-root-title-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/structural-root-title-discovery
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Format changed Python
        run: |
          python -m pip install ruff==0.15.20
          python -m ruff format jellyfin_show_organizer/structural_root_title_fallback.py tests/local/test_structural_root_title_fallback.py
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jellyfin_show_organizer/structural_root_title_fallback.py tests/local/test_structural_root_title_fallback.py
          git commit -m "Format structural root title fallback"
          git push origin HEAD:fix/structural-root-title-discovery
