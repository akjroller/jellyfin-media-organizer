name: Implement issue 38 special numbering

on:
  push:
    branches: [issue-38-special-numbering]
    paths:
      - .github/workflows/implement-issue-38.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: issue-38-special-numbering

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply special-numbering implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"target not found in {path}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Domain model: explicit special/date policies and parse evidence.
          replace_once(
              "jellyfin_show_organizer/models.py",
              "from dataclasses import dataclass\nfrom enum import StrEnum\n",
              "from dataclasses import dataclass\nfrom datetime import date\nfrom enum import StrEnum\n",
          )
          replace_once(
              "jellyfin_show_organizer/models.py",
              '    PARENTHESIZED_ABSOLUTE = "parenthesized-absolute"\n    SEGMENT_TITLE = "segment-title"\n',
              '    PARENTHESIZED_ABSOLUTE = "parenthesized-absolute"\n    SEGMENT_TITLE = "segment-title"\n    SPECIAL = "special"\n    DATE = "date"\n',
          )
          replace_once(
              "jellyfin_show_organizer/models.py",
              "    absolute_episode: int | None = None\n    segment_hint: str | None = None\n",
              "    absolute_episode: int | None = None\n    special_kind: str | None = None\n    special_episode: int | None = None\n    episode_date: str | None = None\n    segment_hint: str | None = None\n",
          )
          replace_once(
              "jellyfin_show_organizer/models.py",
              '        if self.absolute_episode is not None and self.absolute_episode < 0:\n            raise ValueError("absolute_episode cannot be negative")\n        if self.year is not None and self.year < 1800:\n',
              '''        if self.absolute_episode is not None and self.absolute_episode < 0:\n            raise ValueError("absolute_episode cannot be negative")\n        if (self.special_kind is None) != (self.special_episode is None):\n            raise ValueError(\n                "special_kind and special_episode must be provided together"\n            )\n        if self.special_kind is not None:\n            special_kind = self.special_kind.casefold()\n            if special_kind not in {"ova", "oad"}:\n                raise ValueError("special_kind must be 'ova' or 'oad'")\n            object.__setattr__(self, "special_kind", special_kind)\n        if self.special_episode is not None and self.special_episode <= 0:\n            raise ValueError("special_episode must be positive")\n        if self.episode_date is not None:\n            try:\n                normalized_date = date.fromisoformat(self.episode_date).isoformat()\n            except ValueError as exc:\n                raise ValueError("episode_date must use a valid YYYY-MM-DD date") from exc\n            if normalized_date != self.episode_date:\n                raise ValueError("episode_date must use canonical YYYY-MM-DD form")\n        if self.year is not None and self.year < 1800:\n''',
          )

          # Parser: explicit OVA/OAD tokens and unambiguous ISO-like dates.
          replace_once(
              "jellyfin_show_organizer/filename_parser.py",
              "import re\nfrom pathlib import PurePosixPath\n",
              "import re\nfrom datetime import date\nfrom pathlib import PurePosixPath\n",
          )
          replace_once(
              "jellyfin_show_organizer/filename_parser.py",
              "_LEGACY_BRACKETED = re.compile(\n",
              '''_SPECIAL_NUMBERING = re.compile(\n    r"(?i)(?<![A-Za-z0-9])(?P<kind>OVA|OAD)[ ._-]*(?P<episode>\\d{1,3})(?!\\d)"\n)\n_EPISODE_DATE = re.compile(\n    r"(?<!\\d)(?P<year>(?:18|19|20|21)\\d{2})[-._]"\n    r"(?P<month>0[1-9]|1[0-2])[-._](?P<day>0[1-9]|[12]\\d|3[01])(?!\\d)"\n)\n_LEGACY_BRACKETED = re.compile(\n''',
          )
          replace_once(
              "jellyfin_show_organizer/filename_parser.py",
              "def _fallback_series(path: PurePosixPath) -> tuple[str | None, int | None]:\n",
              '''def _episode_date_value(match: re.Match[str]) -> str | None:\n    value = f"{match.group('year')}-{match.group('month')}-{match.group('day')}"\n    try:\n        return date.fromisoformat(value).isoformat()\n    except ValueError:\n        return None\n\n\ndef _fallback_series(path: PurePosixPath) -> tuple[str | None, int | None]:\n''',
          )
          replace_once(
              "jellyfin_show_organizer/filename_parser.py",
              "    match = _EPISODE_WORD.search(stem)\n",
              '''    match = _SPECIAL_NUMBERING.search(stem)\n    if match is not None:\n        series, year = _series_for_match(stem, path, match)\n        return ParseResult(\n            series_hint=series,\n            special_kind=match.group("kind").casefold(),\n            special_episode=int(match.group("episode")),\n            year=year,\n            embedded_tvmaze_id=embedded_id,\n            title_hint=_title_hint(stem, match.end()),\n        )\n\n    date_match = _EPISODE_DATE.search(stem)\n    if date_match is not None:\n        episode_date = _episode_date_value(date_match)\n        if episode_date is not None:\n            series, year = _series_for_match(stem, path, date_match)\n            return ParseResult(\n                series_hint=series,\n                episode_date=episode_date,\n                year=year,\n                embedded_tvmaze_id=embedded_id,\n                title_hint=_title_hint(stem, date_match.end()),\n            )\n\n    match = _EPISODE_WORD.search(stem)\n''',
          )

          # Provider catalog normalization gains airdate/type evidence.
          replace_once(
              "jellyfin_show_organizer/episode_assignment.py",
              "from dataclasses import dataclass, replace\nfrom enum import StrEnum\n",
              "from dataclasses import dataclass, replace\nfrom datetime import date\nfrom enum import StrEnum\n",
          )
          replace_once(
              "jellyfin_show_organizer/episode_assignment.py",
              "    number: int | None\n    title: str\n",
              "    number: int | None\n    title: str\n    airdate: str | None = None\n    episode_type: str | None = None\n",
          )
          replace_once(
              "jellyfin_show_organizer/episode_assignment.py",
              '        if not self.title:\n            raise ValueError("provider episode title cannot be empty")\n',
              '''        if not self.title:\n            raise ValueError("provider episode title cannot be empty")\n        if self.airdate is not None:\n            try:\n                normalized_date = date.fromisoformat(self.airdate).isoformat()\n            except ValueError as exc:\n                raise ValueError("provider episode airdate must use YYYY-MM-DD") from exc\n            if normalized_date != self.airdate:\n                raise ValueError("provider episode airdate must be canonical")\n        if self.episode_type is not None:\n            episode_type = self.episode_type.strip().casefold()\n            if not episode_type:\n                raise ValueError("provider episode type cannot be empty")\n            object.__setattr__(self, "episode_type", episode_type)\n''',
          )
          replace_once(
              "jellyfin_show_organizer/episode_assignment.py",
              '        title = raw.get("name")\n',
              '        title = raw.get("name")\n        airdate = raw.get("airdate")\n        episode_type = raw.get("type")\n',
          )
          replace_once(
              "jellyfin_show_organizer/episode_assignment.py",
              '''        if not isinstance(title, str) or not title.strip():\n            errors.append(f"invalid-catalog-title:{index}")\n            continue\n        episodes.append(\n''',
              '''        if not isinstance(title, str) or not title.strip():\n            errors.append(f"invalid-catalog-title:{index}")\n            continue\n        if airdate is not None:\n            if not isinstance(airdate, str):\n                errors.append(f"invalid-catalog-airdate:{index}")\n                continue\n            try:\n                if date.fromisoformat(airdate).isoformat() != airdate:\n                    raise ValueError\n            except ValueError:\n                errors.append(f"invalid-catalog-airdate:{index}")\n                continue\n        if episode_type is not None and (\n            not isinstance(episode_type, str) or not episode_type.strip()\n        ):\n            errors.append(f"invalid-catalog-type:{index}")\n            continue\n        episodes.append(\n''',
          )
          replace_once(
              "jellyfin_show_organizer/episode_assignment.py",
              '''                number=number,\n                title=title.strip(),\n            )\n''',
              '''                number=number,\n                title=title.strip(),\n                airdate=airdate,\n                episode_type=episode_type,\n            )\n''',
          )

          old_family = '''def _evidence_family(parse: ParseResult) -> str:\n    has_aired = parse.season is not None or bool(parse.episodes)\n    has_absolute = parse.absolute_episode is not None\n    if has_aired and has_absolute:\n        return "conflict"\n    if parse.segment_hint is not None:\n        return "segment"\n    if has_aired:\n        return "aired"\n    if has_absolute:\n        return "absolute"\n    return "none"\n\n\ndef _expected_family(mode: NumberingMode) -> str:\n    if mode is NumberingMode.AIRED:\n        return "aired"\n    if mode in {NumberingMode.ABSOLUTE, NumberingMode.PARENTHESIZED_ABSOLUTE}:\n        return "absolute"\n    return "segment"\n'''
          new_family = '''def _evidence_family(parse: ParseResult) -> str:\n    has_aired = parse.season is not None or bool(parse.episodes)\n    has_absolute = parse.absolute_episode is not None\n    has_special = parse.special_kind is not None or parse.special_episode is not None\n    has_date = parse.episode_date is not None\n\n    if parse.segment_hint is not None:\n        if has_absolute or has_special or has_date:\n            return "conflict"\n        return "segment"\n\n    families = [\n        family\n        for family, present in (\n            ("aired", has_aired),\n            ("absolute", has_absolute),\n            ("special", has_special),\n            ("date", has_date),\n        )\n        if present\n    ]\n    if len(families) > 1:\n        return "conflict"\n    return families[0] if families else "none"\n\n\ndef _expected_family(mode: NumberingMode) -> str:\n    if mode is NumberingMode.AIRED:\n        return "aired"\n    if mode in {NumberingMode.ABSOLUTE, NumberingMode.PARENTHESIZED_ABSOLUTE}:\n        return "absolute"\n    if mode is NumberingMode.SPECIAL:\n        return "special"\n    if mode is NumberingMode.DATE:\n        return "date"\n    return "segment"\n'''
          replace_once("jellyfin_show_organizer/episode_assignment.py", old_family, new_family)

          replace_once(
              "jellyfin_show_organizer/episode_assignment.py",
              "    if parse.absolute_episode is not None or parse.segment_hint is not None:\n",
              "    if (\n        parse.absolute_episode is not None\n        or parse.segment_hint is not None\n        or parse.special_kind is not None\n        or parse.episode_date is not None\n    ):\n",
          )
          replace_once(
              "jellyfin_show_organizer/episode_assignment.py",
              "    if parse.season is not None or parse.episodes or parse.segment_hint is not None:\n",
              "    if (\n        parse.season is not None\n        or parse.episodes\n        or parse.segment_hint is not None\n        or parse.special_kind is not None\n        or parse.episode_date is not None\n    ):\n",
          )

          marker = "def _segment_assignment(\n"
          assignment_text = Path("jellyfin_show_organizer/episode_assignment.py").read_text(encoding="utf-8")
          if marker not in assignment_text:
              raise SystemExit("segment assignment marker missing")
          new_matchers = '''def _special_assignment(\n    source: SourceEpisodeInput,\n    show: CanonicalShow,\n    catalog: _NormalizedCatalog,\n    request_key: str,\n) -> SourceEpisodeAssignment:\n    parse = source.parse\n    if parse.special_kind is None or parse.special_episode is None:\n        return _assignment(\n            source.source_key,\n            AssignmentStatus.UNRESOLVED,\n            "episode-catalog",\n            f"numbering-mode:{show.numbering_mode.value}",\n            "missing-special-numbering-evidence",\n            f"catalog-request:{request_key}",\n        )\n    if (\n        parse.season is not None\n        or parse.episodes\n        or parse.absolute_episode is not None\n        or parse.segment_hint is not None\n        or parse.episode_date is not None\n    ):\n        return _assignment(\n            source.source_key,\n            AssignmentStatus.SUSPICIOUS,\n            "episode-catalog",\n            f"numbering-mode:{show.numbering_mode.value}",\n            "conflicting-numbering-evidence",\n            f"catalog-request:{request_key}",\n        )\n\n    candidates = tuple(\n        episode\n        for episode in catalog.episodes\n        if episode.number == parse.special_episode\n        and (\n            episode.season == 0\n            or (\n                episode.episode_type is not None\n                and episode.episode_type != "regular"\n            )\n        )\n    )\n    if not candidates:\n        return _assignment(\n            source.source_key,\n            AssignmentStatus.UNRESOLVED,\n            "episode-catalog",\n            f"numbering-mode:{show.numbering_mode.value}",\n            f"special-kind:{parse.special_kind}",\n            f"missing-special-catalog-entry:{parse.special_episode}",\n            f"catalog-request:{request_key}",\n        )\n\n    selected = candidates\n    if len(candidates) > 1:\n        kind_token = f" {parse.special_kind} "\n        kind_matches = tuple(\n            episode\n            for episode in candidates\n            if kind_token in f" {_normalize_title(episode.title)} "\n        )\n        if len(kind_matches) == 1:\n            selected = kind_matches\n        else:\n            return _assignment(\n                source.source_key,\n                AssignmentStatus.SUSPICIOUS,\n                "episode-catalog",\n                f"numbering-mode:{show.numbering_mode.value}",\n                f"special-kind:{parse.special_kind}",\n                f"ambiguous-special-catalog-entry:{parse.special_episode}",\n                f"catalog-request:{request_key}",\n            )\n\n    episode = selected[0]\n    return _assignment(\n        source.source_key,\n        AssignmentStatus.MATCHED,\n        "episode-catalog",\n        f"numbering-mode:{show.numbering_mode.value}",\n        f"special-kind:{parse.special_kind}",\n        f"special-number:{parse.special_episode}",\n        f"special-match:{parse.special_kind.upper()}{parse.special_episode}"\n        f"->S{episode.season:02d}E{episode.number:02d}",\n        f"tvmaze-episode:{episode.tvmaze_episode_id}",\n        f"catalog-request:{request_key}",\n        episodes=(episode,),\n        confidence=1.0,\n    )\n\n\ndef _date_assignment(\n    source: SourceEpisodeInput,\n    show: CanonicalShow,\n    catalog: _NormalizedCatalog,\n    request_key: str,\n) -> SourceEpisodeAssignment:\n    parse = source.parse\n    if parse.episode_date is None:\n        return _assignment(\n            source.source_key,\n            AssignmentStatus.UNRESOLVED,\n            "episode-catalog",\n            f"numbering-mode:{show.numbering_mode.value}",\n            "missing-date-numbering-evidence",\n            f"catalog-request:{request_key}",\n        )\n    if (\n        parse.season is not None\n        or parse.episodes\n        or parse.absolute_episode is not None\n        or parse.segment_hint is not None\n        or parse.special_kind is not None\n    ):\n        return _assignment(\n            source.source_key,\n            AssignmentStatus.SUSPICIOUS,\n            "episode-catalog",\n            f"numbering-mode:{show.numbering_mode.value}",\n            "conflicting-numbering-evidence",\n            f"catalog-request:{request_key}",\n        )\n\n    matches = tuple(\n        episode for episode in catalog.episodes if episode.airdate == parse.episode_date\n    )\n    if not matches:\n        return _assignment(\n            source.source_key,\n            AssignmentStatus.UNRESOLVED,\n            "episode-catalog",\n            f"numbering-mode:{show.numbering_mode.value}",\n            f"missing-date-catalog-entry:{parse.episode_date}",\n            f"catalog-request:{request_key}",\n        )\n    if len(matches) > 1:\n        return _assignment(\n            source.source_key,\n            AssignmentStatus.SUSPICIOUS,\n            "episode-catalog",\n            f"numbering-mode:{show.numbering_mode.value}",\n            f"ambiguous-date-catalog-entry:{parse.episode_date}",\n            f"catalog-request:{request_key}",\n        )\n\n    episode = matches[0]\n    return _assignment(\n        source.source_key,\n        AssignmentStatus.MATCHED,\n        "episode-catalog",\n        f"numbering-mode:{show.numbering_mode.value}",\n        f"date-match:{parse.episode_date}"\n        f"->S{episode.season:02d}E{episode.number:02d}",\n        f"tvmaze-episode:{episode.tvmaze_episode_id}",\n        f"catalog-request:{request_key}",\n        episodes=(episode,),\n        confidence=1.0,\n    )\n\n\n'''
          Path("jellyfin_show_organizer/episode_assignment.py").write_text(
              assignment_text.replace(marker, new_matchers + marker, 1),
              encoding="utf-8",
          )
          replace_once(
              "jellyfin_show_organizer/episode_assignment.py",
              '''    if show.numbering_mode in {\n        NumberingMode.ABSOLUTE,\n        NumberingMode.PARENTHESIZED_ABSOLUTE,\n    }:\n        matcher = _absolute_assignment\n    elif show.numbering_mode is NumberingMode.SEGMENT_TITLE:\n        matcher = _segment_assignment\n''',
              '''    if show.numbering_mode in {\n        NumberingMode.ABSOLUTE,\n        NumberingMode.PARENTHESIZED_ABSOLUTE,\n    }:\n        matcher = _absolute_assignment\n    elif show.numbering_mode is NumberingMode.SPECIAL:\n        matcher = _special_assignment\n    elif show.numbering_mode is NumberingMode.DATE:\n        matcher = _date_assignment\n    elif show.numbering_mode is NumberingMode.SEGMENT_TITLE:\n        matcher = _segment_assignment\n''',
          )

          # Plan schema carries the new explicit parse evidence and policies.
          replace_once(
              "jellyfin_show_organizer/data/plan-schema-v1.json",
              '"required": ["series_hint", "season", "episodes", "absolute_episode", "segment_hint", "year", "embedded_tvmaze_id", "title_hint"]',
              '"required": ["series_hint", "season", "episodes", "absolute_episode", "special_kind", "special_episode", "episode_date", "segment_hint", "year", "embedded_tvmaze_id", "title_hint"]',
          )
          replace_once(
              "jellyfin_show_organizer/data/plan-schema-v1.json",
              '        "absolute_episode": {"type": ["integer", "null"], "minimum": 0},\n        "segment_hint":',
              '        "absolute_episode": {"type": ["integer", "null"], "minimum": 0},\n        "special_kind": {"enum": ["ova", "oad", null]},\n        "special_episode": {"type": ["integer", "null"], "minimum": 1},\n        "episode_date": {"type": ["string", "null"], "pattern": "^\\\\d{4}-\\\\d{2}-\\\\d{2}$"},\n        "segment_hint":',
          )
          replace_once(
              "jellyfin_show_organizer/data/plan-schema-v1.json",
              '"numbering_mode": {"enum": ["aired", "absolute", "parenthesized-absolute", "segment-title"]}',
              '"numbering_mode": {"enum": ["aired", "absolute", "parenthesized-absolute", "segment-title", "special", "date"]}',
          )

          # Destination audit evidence records the selected numbering policy.
          replace_once(
              "jellyfin_show_organizer/destination.py",
              '        "jellyfin-series-season-episode-layout",\n        f"canonical-tvmaze-id:{show.tvmaze_id}",\n',
              '        "jellyfin-series-season-episode-layout",\n        f"numbering-mode:{show.numbering_mode.value}",\n        f"canonical-tvmaze-id:{show.tvmaze_id}",\n',
          )

          # Existing enum contract test expands with the two explicit policies.
          replace_once(
              "tests/local/test_organizer_models.py",
              '        "segment-title",\n    }\n',
              '        "segment-title",\n        "special",\n        "date",\n    }\n',
          )

          Path("tests/local/test_special_numbering.py").write_text(
              '''from __future__ import annotations\n\nfrom collections.abc import Mapping\nfrom pathlib import Path\n\nimport pytest\n\nfrom jellyfin_show_organizer.destination import build_episode_destination\nfrom jellyfin_show_organizer.episode_assignment import (\n    AssignmentStatus,\n    SourceEpisodeInput,\n    assign_episode_group,\n)\nfrom jellyfin_show_organizer.filename_parser import parse_video_path\nfrom jellyfin_show_organizer.models import CanonicalShow, NumberingMode, ParseResult\nfrom jellyfin_show_organizer.tvmaze_cache import TvmazeCatalogCache\n\npytestmark = pytest.mark.local\n\n\nclass CountingGetter:\n    def __init__(self, response: object) -> None:\n        self.response = response\n        self.calls: list[tuple[str, Mapping[str, str] | None]] = []\n\n    def __call__(\n        self,\n        url: str,\n        params: Mapping[str, str] | None = None,\n    ) -> object:\n        self.calls.append((url, params))\n        return self.response\n\n\ndef _show(mode: NumberingMode) -> CanonicalShow:\n    return CanonicalShow(\n        source_key="Example Series",\n        tvmaze_id=4242,\n        title="Example Series",\n        year=2024,\n        numbering_mode=mode,\n    )\n\n\ndef test_parser_preserves_ova_and_oad_numbering_evidence() -> None:\n    ova = parse_video_path(\n        "synthetic/Example Series/Example Series OVA 02 - Moonlight.mkv"\n    )\n    oad = parse_video_path(\n        "synthetic/Example Series/Example Series OAD01 - Harbor Day.mkv"\n    )\n\n    assert ova == ParseResult(\n        series_hint="Example Series",\n        special_kind="ova",\n        special_episode=2,\n        title_hint="Moonlight",\n    )\n    assert oad == ParseResult(\n        series_hint="Example Series",\n        special_kind="oad",\n        special_episode=1,\n        title_hint="Harbor Day",\n    )\n\n\ndef test_parser_preserves_episode_date_without_confusing_show_year() -> None:\n    parsed = parse_video_path(\n        "synthetic/Mirror City (2005)/Mirror City (2005) 2024-03-14 Broadcast.mkv"\n    )\n\n    assert parsed == ParseResult(\n        series_hint="Mirror City",\n        episode_date="2024-03-14",\n        year=2005,\n        title_hint="Broadcast",\n    )\n\n\ndef test_invalid_calendar_date_is_not_promoted_to_date_evidence() -> None:\n    parsed = parse_video_path(\n        "synthetic/Mirror City/Mirror City 2024-02-31 Broadcast.mkv"\n    )\n\n    assert parsed.episode_date is None\n    assert parsed.special_kind is None\n\n\ndef test_title_word_special_does_not_change_numbering_policy() -> None:\n    parsed = parse_video_path(\n        "synthetic/Mirror City/Mirror City S01E02 Special Delivery.mkv"\n    )\n\n    assert parsed.season == 1\n    assert parsed.episodes == (2,)\n    assert parsed.title_hint == "Special Delivery"\n    assert parsed.special_kind is None\n    assert parsed.special_episode is None\n\n\ndef test_unique_special_provider_evidence_maps_ova(tmp_path: Path) -> None:\n    getter = CountingGetter(\n        [\n            {\n                "id": 9001,\n                "season": 0,\n                "number": 1,\n                "name": "Bonus Flight",\n                "type": "significant_special",\n                "airdate": "2024-01-02",\n            }\n        ]\n    )\n    result = assign_episode_group(\n        _show(NumberingMode.SPECIAL),\n        (\n            SourceEpisodeInput(\n                "ova.mkv",\n                ParseResult(special_kind="ova", special_episode=1),\n            ),\n        ),\n        TvmazeCatalogCache(tmp_path / "cache"),\n        getter,\n    )\n\n    assignment = result.assignments[0]\n    assert result.status is AssignmentStatus.MATCHED\n    assert assignment.episodes[0].tvmaze_episode_id == 9001\n    assert "numbering-mode:special" in assignment.evidence.reasons\n    assert "special-kind:ova" in assignment.evidence.reasons\n\n    destination = build_episode_destination(\n        _show(NumberingMode.SPECIAL), assignment, ".mkv"\n    )\n    assert destination.relative_path is not None\n    assert "/Season 00/" in destination.relative_path\n    assert "numbering-mode:special" in destination.reasons\n\n\ndef test_ambiguous_special_provider_evidence_fails_closed(tmp_path: Path) -> None:\n    getter = CountingGetter(\n        [\n            {\n                "id": 9001,\n                "season": 0,\n                "number": 1,\n                "name": "Bonus Alpha",\n                "type": "significant_special",\n            },\n            {\n                "id": 9101,\n                "season": 9,\n                "number": 1,\n                "name": "Bonus Beta",\n                "type": "significant_special",\n            },\n        ]\n    )\n    result = assign_episode_group(\n        _show(NumberingMode.SPECIAL),\n        (\n            SourceEpisodeInput(\n                "ova.mkv",\n                ParseResult(special_kind="ova", special_episode=1),\n            ),\n        ),\n        TvmazeCatalogCache(tmp_path / "cache"),\n        getter,\n    )\n\n    assert result.status is AssignmentStatus.SUSPICIOUS\n    assert "ambiguous-special-catalog-entry:1" in result.assignments[0].evidence.reasons\n\n\ndef test_kind_labeled_special_breaks_otherwise_ambiguous_tie(tmp_path: Path) -> None:\n    getter = CountingGetter(\n        [\n            {\n                "id": 9001,\n                "season": 0,\n                "number": 1,\n                "name": "OVA - Bonus Alpha",\n                "type": "significant_special",\n            },\n            {\n                "id": 9101,\n                "season": 9,\n                "number": 1,\n                "name": "OAD - Bonus Beta",\n                "type": "significant_special",\n            },\n        ]\n    )\n    result = assign_episode_group(\n        _show(NumberingMode.SPECIAL),\n        (\n            SourceEpisodeInput(\n                "ova.mkv",\n                ParseResult(special_kind="ova", special_episode=1),\n            ),\n        ),\n        TvmazeCatalogCache(tmp_path / "cache"),\n        getter,\n    )\n\n    assert result.status is AssignmentStatus.MATCHED\n    assert result.assignments[0].episodes[0].tvmaze_episode_id == 9001\n\n\ndef test_unique_airdate_maps_date_numbering(tmp_path: Path) -> None:\n    getter = CountingGetter(\n        [\n            {\n                "id": 1005,\n                "season": 1,\n                "number": 5,\n                "name": "Broadcast",\n                "airdate": "2024-03-14",\n            }\n        ]\n    )\n    result = assign_episode_group(\n        _show(NumberingMode.DATE),\n        (\n            SourceEpisodeInput(\n                "broadcast.mkv",\n                ParseResult(episode_date="2024-03-14"),\n            ),\n        ),\n        TvmazeCatalogCache(tmp_path / "cache"),\n        getter,\n    )\n\n    assignment = result.assignments[0]\n    assert result.status is AssignmentStatus.MATCHED\n    assert assignment.episodes[0].tvmaze_episode_id == 1005\n    assert "numbering-mode:date" in assignment.evidence.reasons\n    assert "date-match:2024-03-14->S01E05" in assignment.evidence.reasons\n\n\ndef test_duplicate_airdate_remains_suspicious(tmp_path: Path) -> None:\n    getter = CountingGetter(\n        [\n            {\n                "id": 1005,\n                "season": 1,\n                "number": 5,\n                "name": "First",\n                "airdate": "2024-03-14",\n            },\n            {\n                "id": 2001,\n                "season": 2,\n                "number": 1,\n                "name": "Second",\n                "airdate": "2024-03-14",\n            },\n        ]\n    )\n    result = assign_episode_group(\n        _show(NumberingMode.DATE),\n        (\n            SourceEpisodeInput(\n                "broadcast.mkv",\n                ParseResult(episode_date="2024-03-14"),\n            ),\n        ),\n        TvmazeCatalogCache(tmp_path / "cache"),\n        getter,\n    )\n\n    assert result.status is AssignmentStatus.SUSPICIOUS\n    assert (\n        "ambiguous-date-catalog-entry:2024-03-14"\n        in result.assignments[0].evidence.reasons\n    )\n\n\ndef test_missing_airdate_remains_unresolved(tmp_path: Path) -> None:\n    getter = CountingGetter(\n        [\n            {\n                "id": 1005,\n                "season": 1,\n                "number": 5,\n                "name": "Other Day",\n                "airdate": "2024-03-15",\n            }\n        ]\n    )\n    result = assign_episode_group(\n        _show(NumberingMode.DATE),\n        (\n            SourceEpisodeInput(\n                "broadcast.mkv",\n                ParseResult(episode_date="2024-03-14"),\n            ),\n        ),\n        TvmazeCatalogCache(tmp_path / "cache"),\n        getter,\n    )\n\n    assert result.status is AssignmentStatus.UNRESOLVED\n    assert "missing-date-catalog-entry:2024-03-14" in (\n        result.assignments[0].evidence.reasons\n    )\n\n\ndef test_group_cannot_mix_date_and_aired_numbering(tmp_path: Path) -> None:\n    getter = CountingGetter([])\n    result = assign_episode_group(\n        _show(NumberingMode.DATE),\n        (\n            SourceEpisodeInput(\n                "aired.mkv", ParseResult(season=1, episodes=(1,))\n            ),\n            SourceEpisodeInput(\n                "dated.mkv", ParseResult(episode_date="2024-03-14")\n            ),\n        ),\n        TvmazeCatalogCache(tmp_path / "cache"),\n        getter,\n    )\n\n    assert result.status is AssignmentStatus.SUSPICIOUS\n    assert getter.calls == []\n    assert "mixed-numbering-evidence:aired,date" in (\n        result.assignments[0].evidence.reasons\n    )\n\n\ndef test_numbering_policy_conflict_stops_before_provider_access(tmp_path: Path) -> None:\n    getter = CountingGetter([])\n    result = assign_episode_group(\n        _show(NumberingMode.AIRED),\n        (\n            SourceEpisodeInput(\n                "ova.mkv", ParseResult(special_kind="ova", special_episode=1)\n            ),\n        ),\n        TvmazeCatalogCache(tmp_path / "cache"),\n        getter,\n    )\n\n    assert result.status is AssignmentStatus.SUSPICIOUS\n    assert getter.calls == []\n    assert result.assignments[0].evidence.reasons[0].startswith(\n        "numbering-policy-conflict:expected-aired:observed-special"\n    )\n''',
              encoding="utf-8",
          )

          Path("docs/numbering-policies.md").write_text(
              '''# Episode numbering policies\n\nJMO records numbering policy explicitly on the canonical show and in assignment evidence. The parser only preserves deterministic hints; provider-backed assignment decides whether those hints identify one catalog episode.\n\nSupported policies are `aired`, `absolute`, `parenthesized-absolute`, `segment-title`, `special`, and `date`. Season `00` remains valid aired numbering and is never rewritten as season one. `special` is reserved for explicit `OVA`/`OAD` numbering evidence; the ordinary word `special` in an episode title does not switch policy. `date` accepts a valid `YYYY-MM-DD` episode date and does not treat a standalone release year as an episode date.\n\nSpecial and date mapping fail closed. Missing provider entries remain unresolved, duplicate date candidates remain suspicious, and ambiguous special candidates require unique provider evidence. A source-show group cannot mix numbering families silently.\n\nAdditional provider-supported orderings should be represented as explicit numbering policies plus normalized catalog evidence rather than show-specific filename-parser branches.\n''',
              encoding="utf-8",
          )
          PY

      - name: Install development tools
        run: python -m pip install -e ".[dev]"

      - name: Normalize changed files
        run: |
          python -m ruff check --fix jellyfin_show_organizer/models.py jellyfin_show_organizer/filename_parser.py jellyfin_show_organizer/episode_assignment.py jellyfin_show_organizer/destination.py tests/local/test_organizer_models.py tests/local/test_special_numbering.py
          python -m ruff format jellyfin_show_organizer/models.py jellyfin_show_organizer/filename_parser.py jellyfin_show_organizer/episode_assignment.py jellyfin_show_organizer/destination.py tests/local/test_organizer_models.py tests/local/test_special_numbering.py

      - name: Run targeted checks
        env:
          JMO_TEST_NO_NETWORK: "1"
        run: |
          python -m mypy jellyfin_show_organizer tests/local/test_special_numbering.py tests/local/test_filename_parser.py tests/local/test_episode_assignment.py tests/local/test_organizer_models.py tests/local/test_organizer_schema.py
          python -m pytest tests/local/test_special_numbering.py tests/local/test_filename_parser.py tests/local/test_episode_assignment.py tests/local/test_organizer_models.py tests/local/test_organizer_schema.py

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jellyfin_show_organizer tests/local docs/numbering-policies.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Support explicit special and date numbering"
          git push origin HEAD:issue-38-special-numbering
