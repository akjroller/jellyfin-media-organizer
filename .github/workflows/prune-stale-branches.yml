name: Prune stale development branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prune-stale-branches.yml

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branches=(
            'branding/jmo'
            'cleanup/standalone-organizer'
            'codex/issue-2-fixture-corpus'
            'codex/issue-3-plan-models'
            'codex/issue-13-offline-ci'
            'codex/jellyfin-show-organizer'
            'dependabot/github_actions/docker/login-action-4.5.2'
            'dependabot/uv/cryptography-50.0.0'
            'dependabot/uv/guessit-4.1.0'
            'dependabot/uv/requests-cache-1.3.3'
            'dependabot/uv/ruff-0.15.22'
            'dependabot/uv/setuptools-83.0.0'
            'dependabot/uv/types-requests-2.33.0.20260712'
            'issue-1-bootstrap-organizer'
            'issue-2-inventory-reconciliation'
            'issue-2-synthetic-reconciliation'
            'issue-3-organizer-models-schema'
            'issue-4-deterministic-inventory'
            'issue-5-filename-parser'
            'issue-6-tvmaze-cache'
            'issue-7-canonical-show-resolution'
            'issue-16-windows-runbook'
            'port-proven-local-patches'
            'rebase-issue-3-organizer-models-schema'
            'v3'
            'maintenance/prune-stale-branches'
            'maintenance/prune-stale-branches-2'
          )

          for branch in "${branches[@]}"; do
            echo "Deleting ${branch}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" || true
          done

          echo 'Remaining branches:'
          gh api "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name'

          unexpected="$(gh api "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '[.[].name | select(. != "main" and . != "issue-8-extra-classification")] | length')"
          if [ "$unexpected" -ne 0 ]; then
            echo "Unexpected branches remain after cleanup" >&2
            exit 1
          fi
