name: Issue 112 refactor

on:
  push:
    branches: [issue-112-extra-destination-identity]

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_CONSTRAINT: ${{ github.workspace }}/requirements-ci.txt

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-112-extra-destination-identity
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply extra identity integration
        run: |
          python - <<'PY'
          from pathlib import Path

          destination = Path("jellyfin_show_organizer/destination.py")
          text = destination.read_text(encoding="utf-8")
          old = """from .episode_assignment import (\n    AssignmentStatus,\n    ProviderEpisode,\n    SourceEpisodeAssignment,\n)\nfrom .models import CanonicalShow, ExtraDecision\n"""
          new = """from .episode_assignment import (\n    AssignmentStatus,\n    ProviderEpisode,\n    SourceEpisodeAssignment,\n)\nfrom .extra_naming import derive_extra_display_identity\nfrom .models import CanonicalShow, ExtraDecision\n"""
          assert old in text
          text = text.replace(old, new, 1)
          old = """    extra_kind = extra.kind.casefold()\n    folder = _EXTRA_FOLDERS.get(extra_kind, \"extras\")\n    title = (display_title or _EXTRA_DEFAULT_TITLES.get(extra_kind, \"Extra\")).strip()\n    if not title:\n        return _unresolved(source_key, \"extra-display-title-is-empty\")\n"""
          new = """    extra_kind = extra.kind.casefold()\n    folder = _EXTRA_FOLDERS.get(extra_kind, \"extras\")\n    naming = derive_extra_display_identity(\n        source_key,\n        extra_kind,\n        show_title=show.title,\n        title_hint=display_title,\n    )\n    title = naming.display_title\n"""
          assert old in text
          text = text.replace(old, new, 1)
          old = """    if show.provider == \"tvmaze\":\n        reasons.append(f\"canonical-tvmaze-id:{show.provider_id}\")\n    reasons.extend(f\"jellyfin-provider-tag:{tag}\" for tag in provider_tags)\n"""
          new = """    if show.provider == \"tvmaze\":\n        reasons.append(f\"canonical-tvmaze-id:{show.provider_id}\")\n    reasons.extend(naming.reasons)\n    reasons.extend(f\"jellyfin-provider-tag:{tag}\" for tag in provider_tags)\n"""
          # Only replace the occurrence in build_extra_destination (last occurrence).
          assert text.count(old) >= 1
          pos = text.rfind(old)
          text = text[:pos] + new + text[pos + len(old):]
          destination.write_text(text, encoding="utf-8")

          planner = Path("jellyfin_show_organizer/planner.py")
          text = planner.read_text(encoding="utf-8")
          old = "from .extra_classifier import ExtraClassification, ExtraDisposition, classify_extra\n"
          new = old + "from .extra_naming import derive_extra_display_identity\n"
          assert old in text
          text = text.replace(old, new, 1)
          old = """        if classification.disposition is ExtraDisposition.EXTRA:\n            assert classification.decision is not None\n            destination = build_extra_destination(\n                show,\n                source_key=source.relative_path,\n                extra=classification.decision,\n                source_extension=source.extension,\n                display_title=classification.parse.title_hint,\n                policy=destination_policy,\n            )\n            evidence = _combine_evidence(\n                resolution.evidence,\n                _classification_evidence(classification),\n            )\n"""
          new = """        if classification.disposition is ExtraDisposition.EXTRA:\n            assert classification.decision is not None\n            naming = derive_extra_display_identity(\n                source.relative_path,\n                classification.decision.kind,\n                show_title=show.title,\n                title_hint=classification.parse.title_hint,\n            )\n            destination = build_extra_destination(\n                show,\n                source_key=source.relative_path,\n                extra=classification.decision,\n                source_extension=source.extension,\n                display_title=classification.parse.title_hint,\n                policy=destination_policy,\n            )\n            evidence = _combine_evidence(\n                resolution.evidence,\n                _classification_evidence(classification),\n                MatchEvidence(\n                    method=\"extra-naming\",\n                    confidence=1.0,\n                    reasons=naming.reasons,\n                ),\n            )\n"""
          assert old in text
          text = text.replace(old, new, 1)
          old = """    if record.extra is not None:\n        return f\"{show_identity}:extra:{record.extra.kind}\"\n"""
          new = """    if record.extra is not None:\n        naming = derive_extra_display_identity(\n            record.source.relative_path,\n            record.extra.kind,\n            show_title=record.show.title,\n            title_hint=record.parse.title_hint if record.parse is not None else None,\n        )\n        return f\"{show_identity}:extra:{record.extra.kind}:{naming.identity_key}\"\n"""
          assert old in text
          text = text.replace(old, new, 1)
          planner.write_text(text, encoding="utf-8")

          classifier = Path("jellyfin_show_organizer/extra_classifier.py")
          text = classifier.read_text(encoding="utf-8")
          old = """_STRUCTURAL_SEASON_EXTRA = re.compile(\n    r\"(?i)(?<![A-Za-z0-9])s\\d{1,2}[ ._-]*extras?(?:[ ._-]*\\d{1,3})?(?![A-Za-z])\"\n)\n"""
          new = old + """_CREDITLESS_VARIANTS: dict[ExtraKind, re.Pattern[str]] = {\n    ExtraKind.CREDITLESS_OPENING: re.compile(\n        r\"(?i)(?<![A-Za-z0-9])(?:ncop|creditless[ ._-]+opening|clean[ ._-]+opening)\"\n        r\"[ ._-]*(?P<variant>\\d{1,3})(?![A-Za-z0-9])\"\n    ),\n    ExtraKind.CREDITLESS_ENDING: re.compile(\n        r\"(?i)(?<![A-Za-z0-9])(?:nced|creditless[ ._-]+ending|clean[ ._-]+ending)\"\n        r\"[ ._-]*(?P<variant>\\d{1,3})(?![A-Za-z0-9])\"\n    ),\n}\n"""
          assert old in text
          text = text.replace(old, new, 1)
          old = """    if any(kind is ExtraKind.DELETED_SCENE for kind, _ in hits):\n        hits = [(kind, reason) for kind, reason in hits if kind is not ExtraKind.CLIP]\n\n    return tuple(hits)\n"""
          new = """    if any(kind is ExtraKind.DELETED_SCENE for kind, _ in hits):\n        hits = [(kind, reason) for kind, reason in hits if kind is not ExtraKind.CLIP]\n\n    if any(kind is not ExtraKind.EXTRA for kind, _ in hits):\n        hits = [\n            (kind, reason)\n            for kind, reason in hits\n            if not (\n                kind is ExtraKind.EXTRA\n                and reason == \"structural season-extra marker\"\n            )\n        ]\n\n    return tuple(hits)\n\n\ndef _creditless_variant_matches_parse(\n    path: PurePosixPath,\n    kind: ExtraKind,\n    parsed: ParseResult,\n) -> bool:\n    pattern = _CREDITLESS_VARIANTS.get(kind)\n    if pattern is None or parsed.absolute_episode is None:\n        return False\n    match = pattern.search(path.stem)\n    return (\n        match is not None\n        and parsed.season is None\n        and not parsed.episodes\n        and parsed.absolute_episode == int(match.group(\"variant\"))\n    )\n"""
          assert old in text
          text = text.replace(old, new, 1)
          old = """        if strong_episode or special_numbering_match is not None:\n            conflict = \"strong episode evidence\"\n            if special_numbering_match is not None and not strong_episode:\n                conflict = \"special-numbering evidence\"\n            return ExtraClassification(\n"""
          new = """        creditless_variant = _creditless_variant_matches_parse(path, kind, parsed)\n        if (strong_episode and not creditless_variant) or special_numbering_match is not None:\n            conflict = \"strong episode evidence\"\n            if special_numbering_match is not None and not strong_episode:\n                conflict = \"special-numbering evidence\"\n            return ExtraClassification(\n"""
          assert old in text
          text = text.replace(old, new, 1)
          classifier.write_text(text, encoding="utf-8")
          PY
      - run: python -m pip install -e ".[dev]"
      - name: Format and validate
        env:
          JMO_TEST_NO_NETWORK: "1"
        run: |
          python -m ruff format jellyfin_show_organizer/extra_naming.py jellyfin_show_organizer/extra_classifier.py jellyfin_show_organizer/destination.py jellyfin_show_organizer/planner.py tests/local/test_extra_destination_identity.py
          python -m ruff check jellyfin_show_organizer tests tools
          python -m ruff format --check jellyfin_show_organizer tests tools
          python -m mypy jellyfin_show_organizer tests
          python -m pytest -m "not live_provider"
      - name: Persist verified changes
        run: |
          git config user.name "jmo-refactor"
          git config user.email "jmo-refactor@users.noreply.github.com"
          git add jellyfin_show_organizer/extra_naming.py jellyfin_show_organizer/extra_classifier.py jellyfin_show_organizer/destination.py jellyfin_show_organizer/planner.py tests/local/test_extra_destination_identity.py
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Integrate distinct extra identities [skip ci]"
            git push
          fi
