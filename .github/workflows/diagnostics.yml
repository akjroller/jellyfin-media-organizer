name: JMO diagnostics

on:
  pull_request:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_CONSTRAINT: ${{ github.workspace }}/requirements-ci.txt

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-ci.txt

      - name: Install constrained development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Capture diagnostics
        shell: bash
        run: |
          python -m ruff check jellyfin_show_organizer tests tools --output-format=concise > ruff-lint.txt 2>&1 || true
          python -m ruff format --check --diff jellyfin_show_organizer tests tools > ruff-format.patch 2>&1 || true

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: jmo-ruff-diagnostics
          path: |
            ruff-lint.txt
            ruff-format.patch
          if-no-files-found: error
          retention-days: 1
