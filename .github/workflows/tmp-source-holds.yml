name: Temporary source hold validation

on:
  push:
    branches:
      - feat/source-hold-overrides

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/source-hold-overrides
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m pip install -e .
      - run: python tools/tmp_patch_source_holds.py
      - run: python tools/tmp_update_schema_v2_tests.py
      - run: python -m ruff format jellyfin_show_organizer tests/local
      - run: python -m ruff check jellyfin_show_organizer tests/local
      - run: python -m mypy jellyfin_show_organizer
      - run: python -m pytest -q
      - name: Commit permanent patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jellyfin_show_organizer tests/local
          git commit -m 'Support explicit local source holds'
          git push origin HEAD:feat/source-hold-overrides
