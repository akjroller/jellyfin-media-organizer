name: Temporary special fallback formatter

on:
  push:
    branches:
      - fix/special-title-date-fallback

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/special-title-date-fallback
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff==0.15.20"
      - run: python -m ruff format jellyfin_show_organizer/mixed_episode_assignment.py tests/local/test_special_title_date_fallback.py
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jellyfin_show_organizer/mixed_episode_assignment.py tests/local/test_special_title_date_fallback.py
          git commit -m "Apply Ruff formatting to special fallback"
          git push origin HEAD:fix/special-title-date-fallback
