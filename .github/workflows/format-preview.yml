name: Temporary provider duplicate format preview

on:
  push:
    branches:
      - fix/provider-episode-duplicate-selection

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff==0.15.20"
      - run: python -m ruff check --fix --diff jellyfin_show_organizer/planner.py jellyfin_show_organizer/release_quality.py tests/local/test_provider_episode_duplicate_selection.py
      - run: python -m ruff format --diff jellyfin_show_organizer/planner.py jellyfin_show_organizer/release_quality.py tests/local/test_provider_episode_duplicate_selection.py