name: Temporary release-prefix format preview

on:
  push:
    branches:
      - fix/release-prefix-fallback

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff==0.15.20"
      - run: python -m ruff format --diff jellyfin_show_organizer/release_prefix_fallback.py tests/local/test_release_prefix_fallback.py
