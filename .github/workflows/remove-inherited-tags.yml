name: Remove inherited mnamer tags

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-inherited-tags.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete inherited tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tags=(
            1.0
            1.2
            1.3.0
            1.4.1
            2.0.0
            2.0.1
            2.0.2
            2.1.0
            2.2.0
            2.3.1
            2.3.2
            2.3.3
            2.4.1
            2.4.2
            2.5.2
            2.5.3
            2.5.4
            2.5.5
            2.6.0
            2.7.0
            2.7.1
            2.7.2
          )

          for tag in "${tags[@]}"; do
            echo "Deleting inherited tag ${tag}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}"
          done

          remaining="$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/" --jq 'length')"
          if [ "$remaining" -ne 0 ]; then
            echo "Expected zero tags after cleanup; found $remaining" >&2
            exit 1
          fi
