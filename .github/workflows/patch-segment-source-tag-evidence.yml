name: Temporary segment source tag patch

on:
  push:
    branches:
      - fix/segment-source-tag-evidence

permissions:
  contents: write

jobs:
  patch-and-test:
    # Retry after correcting the temporary patch helper.
    if: contains(github.event.head_commit.message, 'Add temporary segment source tag patch workflow')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CI tools
        run: python -m pip install -r requirements-ci.txt
      - name: Apply patch
        run: python .github/patch_segment_source_tag_evidence.py
      - name: Format changed files
        run: python -m ruff format jellyfin_show_organizer/episode_assignment_strict.py tests/local/test_episode_assignment.py
      - name: Lint changed files
        run: python -m ruff check jellyfin_show_organizer/episode_assignment_strict.py tests/local/test_episode_assignment.py
      - name: Run focused episode assignment tests
        run: python -m pytest tests/local/test_episode_assignment.py tests/local/test_segment_counted_title_remap.py -q
      - name: Run full local suite
        run: python -m pytest tests/local -q
      - name: Commit tested patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jellyfin_show_organizer/episode_assignment_strict.py tests/local/test_episode_assignment.py
          git commit -m "Use proven source tags in segment title cleanup"
          git push origin HEAD:fix/segment-source-tag-evidence
