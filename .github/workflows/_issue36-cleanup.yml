name: Issue 36 temporary cleanup

on:
  push:
    branches: [issue-36-episode-decisions-rebuild]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-36-episode-decisions-rebuild
      - name: Remove temporary rebuild files
        shell: bash
        run: |
          rm -f .github/workflows/_issue36-rebuild.yml
          rm -f .github/workflows/_issue36-fix-smoke.yml
          rm -f .github/workflows/_issue36-cleanup.yml
          rm -f organizer.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary issue 36 rebuild files"
          git push origin HEAD:issue-36-episode-decisions-rebuild
