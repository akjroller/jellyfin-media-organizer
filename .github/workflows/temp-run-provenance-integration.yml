name: Temporary run provenance integration

on:
  push:
    branches:
      - feat/run-provenance
    paths:
      - .github/workflows/temp-run-provenance-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/run-provenance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply integration
        run: python tools/temp_run_provenance_patch.py
      - name: Format changed Python
        run: |
          python -m pip install ruff==0.15.20
          python -m ruff format jellyfin_show_organizer/run_provenance.py jellyfin_show_organizer/reports.py jellyfin_show_organizer/planner.py tests/local/test_run_provenance.py tests/local/test_planner.py
      - name: Run focused checks
        run: |
          python -m pip install -e '.[dev]'
          python -m ruff check jellyfin_show_organizer tests
          python -m mypy jellyfin_show_organizer tests
          python -m pytest tests/local/test_run_provenance.py tests/local/test_audit_reports.py tests/local/test_planner.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jellyfin_show_organizer/run_provenance.py jellyfin_show_organizer/reports.py jellyfin_show_organizer/planner.py tests/local/test_run_provenance.py tests/local/test_planner.py
          git commit -m "Record path-free run provenance"
          git push origin HEAD:feat/run-provenance
