name: PR 174 rescue scope check

on:
  push:
    branches:
      - fix/final-paper-safe-defects
    paths:
      - .github/workflows/temp-pr174-rescue-scope.yml

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-paper-safe-defects
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply rescue-scope correction
        run: python .github/scripts/temp_pr174_single_source_rescue.py
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Validate correction
        run: |
          python -m ruff format jellyfin_show_organizer/show_structural_evidence.py
          python -m ruff check jellyfin_show_organizer tests tools
          python -m ruff format --check jellyfin_show_organizer tests tools
          python -m mypy jellyfin_show_organizer tests
          python -m pytest
      - name: Commit permanent correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jellyfin_show_organizer/show_structural_evidence.py
          git commit -m "Limit coordinate title rescue to one aired source"
          git push origin HEAD:fix/final-paper-safe-defects
