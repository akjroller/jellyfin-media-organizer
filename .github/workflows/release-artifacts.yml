name: Release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_CONSTRAINT: ${{ github.workspace }}/requirements-ci.txt

jobs:
  build-release-artifacts:
    name: Build verified release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install constrained build frontend
        run: python -m pip install build

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        shell: bash
        run: |
          python - <<'PY'
          import os

          from jellyfin_show_organizer import __version__

          expected = f"v{__version__}"
          actual = os.environ["GITHUB_REF_NAME"]
          if actual != expected:
              raise SystemExit(
                  f"release tag {actual!r} does not match package version {expected!r}"
              )
          print(f"release tag matches package version: {actual}")
          PY

      - name: Build wheel and source distribution
        run: python -m build

      - name: Verify built artifacts
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/release-venv"
          "$RUNNER_TEMP/release-venv/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/release-venv/bin/jmo" --version
          "$RUNNER_TEMP/release-venv/bin/organizer" plan --help
          "$RUNNER_TEMP/release-venv/bin/python" - <<'PY'
          from importlib.metadata import version
          from importlib.resources import files
          from jellyfin_show_organizer import __version__

          assert version("jellyfin-media-organizer") == __version__
          data = files("jellyfin_show_organizer").joinpath("data")
          assert data.joinpath("plan-schema-v1.json").is_file()
          assert data.joinpath("overrides-v1.toml").is_file()
          print("release artifact verified")
          PY

      - name: Upload verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jellyfin-media-organizer-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
