name: Release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_CONSTRAINT: ${{ github.workspace }}/requirements-ci.txt

jobs:
  build-release-artifacts:
    name: Build verified release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install constrained build frontend
        run: python -m pip install build

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        shell: bash
        run: |
          python - <<'PY'
          import os

          from jellyfin_show_organizer import __version__

          expected = f"v{__version__}"
          actual = os.environ["GITHUB_REF_NAME"]
          if actual != expected:
              raise SystemExit(
                  f"release tag {actual!r} does not match package version {expected!r}"
              )
          print(f"release tag matches package version: {actual}")
          PY

      - name: Build wheel and source distribution
        run: python -m build

      - name: Verify wheel artifact
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/release-wheel-venv"
          "$RUNNER_TEMP/release-wheel-venv/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/release-wheel-venv/bin/jmo" --version
          "$RUNNER_TEMP/release-wheel-venv/bin/organizer" plan --help
          "$RUNNER_TEMP/release-wheel-venv/bin/python" - <<'PY'
          from importlib.metadata import version
          from importlib.resources import files
          from jellyfin_show_organizer import __version__
          from jellyfin_show_organizer.schema import (
              PLAN_SCHEMA_RESOURCE,
              PLAN_SCHEMA_VERSION,
              load_plan_schema,
          )

          assert version("jellyfin-media-organizer") == __version__
          data = files("jellyfin_show_organizer").joinpath("data")
          assert data.joinpath(PLAN_SCHEMA_RESOURCE.removeprefix("data/")).is_file()
          assert load_plan_schema()["properties"]["schema_version"]["const"] == PLAN_SCHEMA_VERSION
          assert data.joinpath("overrides-v1.toml").is_file()
          print("release wheel verified")
          PY

      - name: Verify source distribution artifact
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/release-sdist-venv"
          "$RUNNER_TEMP/release-sdist-venv/bin/python" -m pip install setuptools wheel
          "$RUNNER_TEMP/release-sdist-venv/bin/python" -m pip install --no-build-isolation --no-deps "$GITHUB_WORKSPACE"/dist/*.tar.gz
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/release-sdist-venv/bin/jmo" --version
          "$RUNNER_TEMP/release-sdist-venv/bin/organizer" plan --help
          "$RUNNER_TEMP/release-sdist-venv/bin/python" - <<'PY'
          from importlib.metadata import version
          from importlib.resources import files
          from jellyfin_show_organizer import __version__
          from jellyfin_show_organizer.schema import (
              PLAN_SCHEMA_RESOURCE,
              PLAN_SCHEMA_VERSION,
              load_plan_schema,
          )

          assert version("jellyfin-media-organizer") == __version__
          data = files("jellyfin_show_organizer").joinpath("data")
          assert data.joinpath(PLAN_SCHEMA_RESOURCE.removeprefix("data/")).is_file()
          assert load_plan_schema()["properties"]["schema_version"]["const"] == PLAN_SCHEMA_VERSION
          assert data.joinpath("overrides-v1.toml").is_file()
          print("release sdist verified")
          PY

      - name: Upload verified artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: jellyfin-media-organizer-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
