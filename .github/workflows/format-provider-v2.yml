name: Format provider boundary

on:
  push:
    branches: [issue-40-provider-adapter-v2]
    paths:
      - .github/workflows/format-provider-v2.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-40-provider-adapter-v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check --fix jellyfin_show_organizer/providers.py tests/local/test_provider_boundary.py jellyfin_show_organizer/models.py
      - run: python -m ruff format jellyfin_show_organizer/providers.py tests/local/test_provider_boundary.py jellyfin_show_organizer/models.py
      - run: python -m ruff check jellyfin_show_organizer/providers.py tests/local/test_provider_boundary.py jellyfin_show_organizer/models.py
      - run: python -m mypy jellyfin_show_organizer/providers.py tests/local/test_provider_boundary.py jellyfin_show_organizer/models.py
      - run: python -m pytest tests/local/test_provider_boundary.py tests/local/test_tvmaze_cache.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jellyfin_show_organizer/providers.py tests/local/test_provider_boundary.py jellyfin_show_organizer/models.py
          git commit -m "Normalize provider boundary code" || exit 0
          git push origin HEAD:issue-40-provider-adapter-v2
