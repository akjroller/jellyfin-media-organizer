name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_CONSTRAINT: ${{ github.workspace }}/requirements-ci.txt

jobs:
  offline-tests:
    name: Offline tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-ci.txt

      - name: Verify CI constraints
        run: python tools/check_ci_constraints.py

      - name: Install constrained development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check jellyfin_show_organizer tests tools

      - name: Format check
        run: python -m ruff format --diff tests/local/test_show_resolver_catalog_tiebreak.py

      - name: Type check
        run: python -m mypy jellyfin_show_organizer tests

      - name: Run offline tests
        env:
          JMO_TEST_NO_NETWORK: "1"
        run: python -m pytest

      - name: CLI smoke test
        run: |
          jmo --version
          organizer --version
          python -m jellyfin_show_organizer --version
          jmo plan --help
          organizer plan --help
          python -m jellyfin_show_organizer plan --help

  repository-safety:
    name: Repository privacy and artifact gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tracked repository content
        run: python tools/check_repository_safety.py

  installed-artifact-smoke:
    name: Built wheel and sdist smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install constrained build frontend
        run: python -m pip install build

      - name: Build wheel and source distribution
        run: python -m build

      - name: Verify wheel in a clean environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-venv/bin/jmo" --version
          "$RUNNER_TEMP/wheel-venv/bin/organizer" plan --help
          "$RUNNER_TEMP/wheel-venv/bin/python" - <<'PY'
          from importlib.metadata import version
          from importlib.resources import files
          from jellyfin_show_organizer import __version__

          assert version("jellyfin-media-organizer") == __version__
          data = files("jellyfin_show_organizer").joinpath("data")
          assert data.joinpath("plan-schema-v1.json").is_file()
          assert data.joinpath("overrides-v1.toml").is_file()
          print("wheel installation verified")
          PY

      - name: Verify sdist in a separate clean environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/sdist-venv"
          "$RUNNER_TEMP/sdist-venv/bin/python" -m pip install setuptools wheel
          "$RUNNER_TEMP/sdist-venv/bin/python" -m pip install --no-build-isolation --no-deps "$GITHUB_WORKSPACE"/dist/*.tar.gz
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sdist-venv/bin/jmo" --version
          "$RUNNER_TEMP/sdist-venv/bin/organizer" plan --help
          "$RUNNER_TEMP/sdist-venv/bin/python" - <<'PY'
          from importlib.metadata import version
          from importlib.resources import files
          from jellyfin_show_organizer import __version__

          assert version("jellyfin-media-organizer") == __version__
          data = files("jellyfin_show_organizer").joinpath("data")
          assert data.joinpath("plan-schema-v1.json").is_file()
          assert data.joinpath("overrides-v1.toml").is_file()
          print("sdist installation verified")
          PY
