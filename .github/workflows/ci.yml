name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check jellyfin_show_organizer tests

      - name: Format check
        run: python -m ruff format --check jellyfin_show_organizer tests

      - name: Test
        run: python -m pytest

      - name: CLI smoke test
        run: |
          jmo plan --help
          organizer plan --help
          python -m jellyfin_show_organizer plan --help
