name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_CONSTRAINT: ${{ github.workspace }}/requirements-ci.txt

jobs:
  offline-tests:
    name: Offline tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-ci.txt

      - name: Verify CI constraints
        run: python tools/check_ci_constraints.py

      - name: Install constrained development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Show sidecar formatter diff
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python -m ruff format --diff jellyfin_show_organizer/sidecars.py tests/local/test_sidecars.py

      - name: Lint
        run: python -m ruff check jellyfin_show_organizer tests tools

      - name: Format check
        run: python -m ruff format --check jellyfin_show_organizer tests tools

      - name: Type check
        run: python -m mypy jellyfin_show_organizer tests

      - name: Run offline tests
        env:
          JMO_TEST_NO_NETWORK: "1"
        run: python -m pytest

      - name: CLI smoke test
        run: |
          jmo plan --help
          organizer plan --help
          python -m jellyfin_show_organizer plan --help

  repository-safety:
    name: Repository privacy and artifact gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tracked repository content
        run: python tools/check_repository_safety.py

  installed-wheel-smoke:
    name: Built wheel smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install constrained build frontend
        run: python -m pip install build

      - name: Build wheel and source distribution
        run: python -m build

      - name: Install built wheel
        shell: bash
        run: python -m pip install --force-reinstall --no-deps dist/*.whl

      - name: Verify installed commands and package data outside source tree
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          jmo plan --help
          organizer plan --help
          python - <<'PY'
          from importlib.resources import files

          data = files("jellyfin_show_organizer").joinpath("data")
          assert data.joinpath("plan-schema-v1.json").is_file()
          assert data.joinpath("overrides-v1.toml").is_file()
          print("installed package data verified")
          PY
