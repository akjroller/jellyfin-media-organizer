name: Format provider plan test

on:
  push:
    branches: [issue-40-provider-adapter]
    paths:
      - .github/workflows/format-provider-plan-test.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: issue-40-provider-adapter

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install development tools
        run: python -m pip install -e ".[dev]"

      - name: Format provider plan test
        run: |
          python -m ruff check --fix tests/local/test_provider_plan_identity.py
          python -m ruff format tests/local/test_provider_plan_identity.py

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/local/test_provider_plan_identity.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format provider plan identity regression"
          git push origin HEAD:issue-40-provider-adapter
