name: Apply provider identity foundation

on:
  push:
    branches: [issue-40-provider-adapter-v2]
    paths:
      - .github/workflows/issue-40-foundation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-40-provider-adapter-v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Add namespaced provider identity
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("jellyfin_show_organizer/models.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "from __future__ import annotations\n\nfrom dataclasses import dataclass\n",
              "from __future__ import annotations\n\nimport re\nimport unicodedata\nfrom dataclasses import dataclass\n",
              1,
          )
          marker = '''class CompanionStatus(StrEnum):\n    ASSOCIATED = "associated"\n    DUPLICATE = "duplicate"\n    IGNORED = "ignored"\n    UNRESOLVED = "unresolved"\n\n\n'''
          addition = marker + '''_PROVIDER_NAME = re.compile(r"^[a-z0-9][a-z0-9._-]*$")\n\n\n@dataclass(frozen=True, slots=True)\nclass ProviderIdentity:\n    """Namespaced identity for one metadata-provider object."""\n\n    provider: str\n    value: str\n\n    def __post_init__(self) -> None:\n        provider = self.normalize_provider(self.provider)\n        value = unicodedata.normalize("NFKC", str(self.value)).strip()\n        if not provider or _PROVIDER_NAME.fullmatch(provider) is None:\n            raise ValueError("provider name must be a normalized identifier")\n        if not value:\n            raise ValueError("provider identity value cannot be empty")\n        object.__setattr__(self, "provider", provider)\n        object.__setattr__(self, "value", value)\n\n    @staticmethod\n    def normalize_provider(provider: str) -> str:\n        return unicodedata.normalize("NFKC", provider).strip().casefold()\n\n    @classmethod\n    def tvmaze(cls, value: int) -> ProviderIdentity:\n        if value <= 0:\n            raise ValueError("TVMaze identity must be positive")\n        return cls("tvmaze", str(value))\n\n    @property\n    def key(self) -> str:\n        return f"{self.provider}:{self.value}"\n\n    def require_positive_int(self, provider: str) -> int:\n        expected = self.normalize_provider(provider)\n        if self.provider != expected:\n            raise ValueError(\n                f"provider identity is {self.provider!r}, expected {expected!r}"\n            )\n        try:\n            value = int(self.value)\n        except ValueError as exc:\n            raise ValueError("provider identity must be a positive integer") from exc\n        if value <= 0 or str(value) != self.value:\n            raise ValueError("provider identity must be a canonical positive integer")\n        return value\n\n\n'''
          if marker not in text:
              raise SystemExit("CompanionStatus insertion marker not found")
          if "class ProviderIdentity:" in text:
              raise SystemExit("ProviderIdentity already exists")
          path.write_text(text.replace(marker, addition, 1), encoding="utf-8")
          PY
          python -m pip install -e ".[dev]"
          python -m ruff format jellyfin_show_organizer/models.py
          python -m ruff check --fix jellyfin_show_organizer/models.py
          python -m ruff format --check jellyfin_show_organizer/models.py
          python -m mypy jellyfin_show_organizer/models.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jellyfin_show_organizer/models.py
          git commit -m "Add namespaced provider identity model"
          git push origin HEAD:issue-40-provider-adapter-v2
