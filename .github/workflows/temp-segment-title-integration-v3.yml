name: Temporary segment title integration v3

on:
  push:
    branches:
      - fix/segment-counted-title-remap
    paths:
      - .github/workflows/temp-segment-title-integration-v3.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/segment-counted-title-remap
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate segment-counted title proof
        run: python tools/temp_segment_patch.py
      - name: Format changed Python
        run: |
          python -m pip install ruff==0.15.20
          python -m ruff format jellyfin_show_organizer/segment_counted_titles.py jellyfin_show_organizer/show_structural_evidence.py jellyfin_show_organizer/_show_resolver_core.py jellyfin_show_organizer/mixed_episode_assignment.py tests/local/test_segment_counted_title_remap.py
      - name: Run focused checks
        run: |
          python -m pip install -e '.[dev]'
          python -m ruff check jellyfin_show_organizer tests
          python -m mypy jellyfin_show_organizer tests
          python -m pytest tests/local/test_segment_counted_title_remap.py tests/local/test_show_resolver_catalog_tiebreak.py tests/local/test_mixed_episode_assignment.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jellyfin_show_organizer/segment_counted_titles.py jellyfin_show_organizer/show_structural_evidence.py jellyfin_show_organizer/_show_resolver_core.py jellyfin_show_organizer/mixed_episode_assignment.py tests/local/test_segment_counted_title_remap.py
          git commit -m "Resolve segment-counted episodes by exact titles"
          git push origin HEAD:fix/segment-counted-title-remap

# rerun after optional-match type cleanup
