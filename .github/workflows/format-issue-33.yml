name: Format issue 33

on:
  push:
    branches: [issue-33-destination-policy]
    paths:
      - .github/workflows/format-issue-33.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: issue-33-destination-policy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install constrained development tools
        run: python -m pip install -e ".[dev]"

      - name: Format issue files
        run: |
          python -m ruff check --fix jellyfin_show_organizer/destination.py tests/local/test_destination.py
          python -m ruff format jellyfin_show_organizer/destination.py tests/local/test_destination.py

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jellyfin_show_organizer/destination.py tests/local/test_destination.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format deterministic destination policy"
          git push origin HEAD:issue-33-destination-policy
