name: Issue 36 smoke harness fix

on:
  push:
    branches: [issue-36-episode-decisions-rebuild]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-36-episode-decisions-rebuild
      - name: Fix smoke command
        shell: bash
        run: |
          sed -i 's/python -m organizer --version/python -m jellyfin_show_organizer --version/' .github/workflows/_issue36-rebuild.yml
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/_issue36-rebuild.yml
          git commit -m "Fix issue 36 rebuild smoke command"
          git push origin HEAD:issue-36-episode-decisions-rebuild
