name: Temporary explicit episode decision patch

on:
  push:
    branches:
      - fix/explicit-episode-decisions-authoritative

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/explicit-episode-decisions-authoritative
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m pip install -e .
      - run: python tools/tmp_patch_explicit_episode_decision.py
      - run: python -m ruff format jellyfin_show_organizer/episode_assignment_strict.py jellyfin_show_organizer/mixed_episode_assignment.py jellyfin_show_organizer/planner.py tests/local/test_explicit_episode_decision_authority.py
      - run: python -m ruff check jellyfin_show_organizer/episode_assignment_strict.py jellyfin_show_organizer/mixed_episode_assignment.py jellyfin_show_organizer/planner.py tests/local/test_explicit_episode_decision_authority.py
      - run: python -m mypy jellyfin_show_organizer
      - run: python -m pytest -q tests/local/test_explicit_episode_decision_authority.py tests/local/test_segment_counted_title_remap.py
      - name: Commit permanent patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jellyfin_show_organizer/episode_assignment_strict.py jellyfin_show_organizer/mixed_episode_assignment.py jellyfin_show_organizer/planner.py tests/local/test_explicit_episode_decision_authority.py
          git commit -m 'Honor explicit episode decisions during recovery'
          git push origin HEAD:fix/explicit-episode-decisions-authoritative
