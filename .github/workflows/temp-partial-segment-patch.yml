name: Temporary partial segment patch

on:
  push:
    branches:
      - fix/partial-mixed-segment-title-rescue
    paths:
      - .github/workflows/temp-partial-segment-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/partial-mixed-segment-title-rescue
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply resolver and test patch
        run: python tools/temp_partial_segment_patch.py
      - name: Format changed Python
        run: |
          python -m pip install ruff==0.12.12
          python -m ruff format jellyfin_show_organizer/show_structural_evidence.py tests/local/test_show_resolver_mixed_segment_tiebreak.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jellyfin_show_organizer/show_structural_evidence.py tests/local/test_show_resolver_mixed_segment_tiebreak.py
          git diff --cached --quiet && exit 0
          git commit -m "Allow partial mixed segment title rescue"
          git push origin HEAD:fix/partial-mixed-segment-title-rescue
