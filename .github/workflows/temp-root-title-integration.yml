name: Temporary root title integration

on:
  push:
    branches:
      - fix/structural-root-title-discovery
    paths:
      - .github/workflows/temp-root-title-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/structural-root-title-discovery
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate structural root fallback
        shell: python
        run: |
          from pathlib import Path

          path = Path('jellyfin_show_organizer/show_resolver.py')
          text = path.read_text(encoding='utf-8')

          old_import = 'from .show_structural_evidence import token_merge_queries\n'
          new_import = (
              'from .show_structural_evidence import token_merge_queries\n'
              'from .structural_root_title_fallback import (\n'
              '    resolve_structural_root_title_fallback,\n'
              ')\n'
          )
          if text.count(old_import) != 1:
              raise SystemExit('expected structural evidence import exactly once')
          text = text.replace(old_import, new_import, 1)

          needle = '''    if release_prefix is not None:\n        result, active_provider = release_prefix\n\n    if _structural_year_span(source_key) is None:\n'''
          replacement = '''    if release_prefix is not None:\n        result, active_provider = release_prefix\n\n    root_title = resolve_structural_root_title_fallback(\n        source_key,\n        parse_group,\n        overrides,\n        active_provider,\n        result,\n    )\n    if root_title is not None:\n        result, active_provider = root_title\n\n    if _structural_year_span(source_key) is None:\n'''
          if text.count(needle) != 1:
              raise SystemExit('expected release-prefix integration point exactly once')
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
      - name: Format resolver
        run: |
          python -m pip install ruff==0.15.20
          python -m ruff format jellyfin_show_organizer/show_resolver.py
      - name: Commit resolver integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jellyfin_show_organizer/show_resolver.py
          git commit -m "Integrate structural root title fallback"
          git push origin HEAD:fix/structural-root-title-discovery
