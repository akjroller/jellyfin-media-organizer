name: Final safe-defect patch check

on:
  push:
    branches:
      - fix/final-paper-safe-defects
    paths:
      - .github/workflows/temp-final-safe-defects.yml

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-paper-safe-defects
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final safe defects
        run: |
          python .github/scripts/temp_final_safe_defects.py
          python .github/scripts/temp_final_safe_defects_fix.py
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Format and focused checks
        run: |
          python -m ruff format jellyfin_show_organizer/filename_parser.py jellyfin_show_organizer/show_structural_evidence.py jellyfin_show_organizer/_show_resolver_core.py tests/local/test_final_paper_safe_defects.py
          python -m ruff check jellyfin_show_organizer/filename_parser.py jellyfin_show_organizer/show_structural_evidence.py jellyfin_show_organizer/_show_resolver_core.py tests/local/test_final_paper_safe_defects.py
          python -m ruff format --check jellyfin_show_organizer/filename_parser.py jellyfin_show_organizer/show_structural_evidence.py jellyfin_show_organizer/_show_resolver_core.py tests/local/test_final_paper_safe_defects.py
          python -m mypy jellyfin_show_organizer tests
          python -m pytest tests/local/test_final_paper_safe_defects.py tests/local/test_filename_parser_parent_release_prefix.py tests/local/test_show_resolver.py tests/local/test_segment_counted_title_remap.py
      - name: Commit permanent changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jellyfin_show_organizer/filename_parser.py jellyfin_show_organizer/show_structural_evidence.py jellyfin_show_organizer/_show_resolver_core.py tests/local/test_final_paper_safe_defects.py
          git commit -m "Finish safe parser and catalog recovery"
          git push origin HEAD:fix/final-paper-safe-defects
