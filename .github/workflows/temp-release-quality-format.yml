name: Temporary release quality formatter

on:
  push:
    branches:
      - fix/release-package-quality-path
    paths:
      - .github/workflows/temp-release-quality-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/release-package-quality-path
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Format target
        run: |
          python -m pip install ruff==0.15.20
          python -m ruff format tests/local/test_duplicate_release_quality_path.py
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/local/test_duplicate_release_quality_path.py
          git commit -m "Format release quality path tests"
          git push origin HEAD:fix/release-package-quality-path
